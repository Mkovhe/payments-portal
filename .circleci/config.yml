version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.0
    environment:
      CI: false
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: npm install
      - run:
          name: Build Project
          command: npm run build
      - run:
          name: SonarCloud Scan
          command: |
            npm install -g sonarqube-scanner
            sonar-scanner \
              -Dsonar.projectKey=mkovhe_payments-portal \
              -Dsonar.organization=mkovhe \
              -Dsonar.sources=src \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=$SONAR_TOKEN

workflows:
  build-and-scan:
    jobs:
      - build
